[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-app"
version = "0.1.0"
description = "A small Flask expense tracker, subject of a DevSecOps pipeline"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Werkzeug==3.0.3",
]

[tool.setuptools.packages.find]
include = ["app*"]
