{% extends 'base.html' %}
{% block title %}Log in — Ledger{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Log in</h1>
    <form method="post">
      <label>Username
        <input name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="{{ url_for('app.register') }}">Register</a></p>
  </div>
{% endblock %}
