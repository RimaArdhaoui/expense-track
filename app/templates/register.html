{% extends 'base.html' %}
{% block title %}Register — Ledger{% endblock %}
{% block content %}
  <div class="auth-card">
    <h1>Create account</h1>
    <form method="post">
      <label>Username
        <input name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required minlength="8">
      </label>
      <button type="submit">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('app.login') }}">Log in</a></p>
  </div>
{% endblock %}
