name: CI

# Baseline DevOps pipeline: install deps + run tests.
# This is the "chaîne DevOps CI/CD terminée" starting point — add your
# Pre-Commit and Commit-stage security tools (Gitleaks, Semgrep, ...)
# as the next jobs in this same workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
